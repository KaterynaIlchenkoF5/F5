# F5 APM HTTP Auth configuration example
# Apply inside an Access Policy (VPE) using the "HTTP Auth" action.
#
# Auth Type  : HTTP
# Method     : POST
# Auth URL   : http://<auth-service-host>:8000/auth
# Auth Headers:
#   Content-Type: application/json
# Auth Body   : {"username":"%{session.logon.last.username}","password":"%{session.logon.last.password}"}
# Success Condition: HTTP response code == 200
# Failure Condition: HTTP response code == 401
#
# Alternatively use HTTP Basic Auth:
# Method     : GET
# Auth URL   : http://<auth-service-host>:8000/auth/basic
# Use Basic Authentication checked, Username/Password session variables above.
