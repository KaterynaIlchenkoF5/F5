version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apm_auth
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apm -d apm_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://apm:${DB_PASSWORD:-changeme}@db/apm_auth"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
